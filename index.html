    <meta property="og:title" content="Lingua14 - İngilizce Öğrenme Platformu" />
    <meta property="og:description" content="Lingua14 modern İngilizce öğrenme platformu: 488 derslik A1-C2 CEFR müfredatı, doğal öğretmen seslendirmesi, interaktif alıştırmalar, cümle kurucu ve akıllı aralıklı tekrar (SRS) sistemi." />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Gracefully handle Vite HMR WebSockets in AI Studio preview iframe
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            try {
              var sUrl = String(url || '');
              var sProto = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
              if (sProto.includes('vite-hmr') || sProto.includes('vite-ping') || sUrl.includes('token=')) {
                isViteHmr = true;
              }
            } catch (e) {}
            if (isViteHmr) {
              var listeners = {};
              var wsMock = {
                readyState: 1, // WebSocket.OPEN
                url: String(url),
                protocol: Array.isArray(protocols) ? protocols[0] || '' : String(protocols || ''),
                send: function() {},
                close: function() {
                  wsMock.readyState = 3; // CLOSED
                  if (listeners['close']) {
                    listeners['close'].forEach(function(fn) { try { fn(new Event('close')); } catch (e) {} });
                  }
                },
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn(new Event('open')); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return wsMock;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (reason) {
            var msg = typeof reason.message === 'string' ? reason.message : String(reason);
            var stack = typeof reason.stack === 'string' ? reason.stack : '';
            if (
              msg.includes('WebSocket') ||
              msg.includes('vite:ws') ||
              stack.includes('@vite/client') ||
              stack.includes('createWebSocketModuleRunnerTransport')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = event && event.message ? String(event.message) : '';
          var fn = event && event.filename ? String(event.filename) : '';
          if (msg.includes('WebSocket') || fn.includes('@vite/client')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

  </body>
